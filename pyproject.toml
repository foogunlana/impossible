[project]
name = "impossible"
version = "0.1.0"
description = "Coding tasks that look solvable and are not: a benchmark for reward hacking under sustained failure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.263",
]

[project.entry-points.inspect_ai]
impossible = "impossible"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impossible"]
